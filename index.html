<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>image2blocks Demo</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 20px; }
      .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      .panel { margin-top: 16px; display: flex; gap: 24px; }
      canvas { border: 1px solid #ddd; max-width: 100%; height: auto; }
      .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      label { display: inline-flex; gap: 6px; align-items: center; }
      .step { font-weight: 600; }
      .boxes { color: #555; font-size: 12px; }
      button { padding: 6px 12px; }
      input[type="number"], input[type="range"] { width: 180px; }
    </style>
  </head>
  <body>
    <h3>image2blocks 前端分步展示</h3>
    <div class="row">
      <input id="file" type="file" accept="image/*" />
      <div class="controls">
        <label>阈值 threshold <input id="threshold" type="range" min="0" max="255" value="128" /></label>
        <label>膨胀半径 dilation <input id="dilation" type="number" min="0" value="20" /></label>
        <label>连通性
          <select id="connectivity">
            <option value="8" selected>8</option>
            <option value="4">4</option>
          </select>
        </label>
      </div>
    </div>

    <div class="row" style="margin-top: 12px;">
      <button id="prev">上一步</button>
      <button id="next">下一步</button>
      <div>当前步骤：<span id="step" class="step">Original</span></div>
      <div class="boxes" id="boxes"></div>
    </div>

    <div class="panel">
      <canvas id="canvas"></canvas>
    </div>

    <script type="module" src="/src/demo/main.ts"></script>
  </body>
  </html>
