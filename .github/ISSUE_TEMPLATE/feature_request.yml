name: "✨ 功能请求 (Feature Request)"
description: "提交一个新功能建议 (Request a feature)"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请尽量详细描述需求。

  - type: input
    id: feature_summary
    attributes:
      label: "功能概述 (Summary)"
      description: "请简要描述你的功能需求"
      placeholder: "例如：支持批量处理图片"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "动机 (Motivation)"
      description: "为什么需要这个功能？它解决了什么问题？"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "建议方案 (Proposed Solution)"
      description: "如果你有具体方案或设计思路，请描述"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案 (Alternatives)"
      description: "是否考虑过其他方案？"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "相关截图或模型 (Screenshots / Mockups)"
      description: "可选，提供截图或草图"
    validations:
      required: false
